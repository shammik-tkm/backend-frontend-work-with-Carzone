{% extends 'landing/includes/base.html' %}
{% block title %}Vkhod v Admin-panel | CARZONA{% endblock %}

{% block content %}
<main class="min-h-screen flex items-center justify-center pt-24 pb-12">
    <div class="w-full max-w-md p-8 bg-brand-card border border-brand-border rounded-2xl shadow-2xl">
        <h1 class="text-2xl font-black italic uppercase text-center mb-6">
            CAR<span class="text-brand-orange">ZONA</span> Admin
        </h1>
        
        {% if error %}
        <div class="mb-4 p-3 bg-red-500/20 border border-red-500 text-red-300 text-xs rounded-xl">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold uppercase mb-2">Login</label>
                <input type="text" name="username" required class="w-full px-4 py-3 bg-[#08090c] border border-brand-border rounded-xl text-white text-sm focus:outline-none focus:border-brand-orange">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase mb-2">Parol</label>
                <input type="password" name="password" required class="w-full px-4 py-3 bg-[#08090c] border border-brand-border rounded-xl text-white text-sm focus:outline-none focus:border-brand-orange">
            </div>
            <button type="submit" class="w-full py-3.5 bg-brand-orange font-extrabold text-white rounded-xl hover:bg-brand-orangeHover transition">
                Voyti
            </button>
        </form>
    </div>
</main>
{% endblock %}
