{% load static %}
<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#08090c">
    <title>{% block title %}CARZONA – Lack & Smart Repair | Neuss{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#ff5500',
                            orangeHover: '#ff7700',
                            dark: '#08090c',
                            card: '#12141c',
                            border: '#232736',
                            muted: '#8e96a7'
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-brand-dark text-white antialiased selection:bg-brand-orange selection:text-white">

<div id="scrollBar"></div>

{% include 'landing/includes/header.html' %}

{% block content %}{% endblock %}

{% include 'landing/includes/footer.html' %}

<a id="fabWhatsapp" class="fab fixed bottom-5 right-5 z-40 w-12 h-12 rounded-full bg-[#25D366] text-white flex items-center justify-center text-2xl shadow-lg hover:scale-110 transition" 
    href="https://wa.me/491729039100?text=Hallo%20CARZONA%2C%20ich%20habe%20eine%20Anfrage." 
    target="_blank" rel="noopener noreferrer" aria-label="WhatsApp öffnen">
    <i class="fab fa-whatsapp"></i>
</a>

<script src="{% static 'js/mobile_menu.js' %}"></script>
<script src="{% static 'js/scroll.js' %}"></script>
<script src="{% static 'js/color_picker.js' %}"></script>
<script src="{% static 'js/before_after_slider.js' %}"></script>
<script src="{% static 'js/faq_accordion.js' %}"></script>
<script src="{% static 'js/contact_form.js' %}"></script>
<script src="{% static 'js/before-after.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
